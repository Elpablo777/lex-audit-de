services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lexaudit-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexaudit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lexaudit}
    volumes:
      - lexaudit_pgdata:/var/lib/postgresql/data
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexaudit} -d ${POSTGRES_DB:-lexaudit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  neo4j:
    image: neo4j:5.26-community
    container_name: lexaudit-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-lexaudit_neo4j_dev}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - lexaudit_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  api:
    image: python:3.12-slim
    container_name: lexaudit-api
    profiles: ["full"]
    working_dir: /app
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lexaudit}:${POSTGRES_PASSWORD:-lexaudit_dev}@postgres:5432/${POSTGRES_DB:-lexaudit}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-lexaudit_neo4j_dev}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir uv && uv sync --frozen --no-dev && uv run uvicorn lexaudit_api.main:app --host 0.0.0.0 --port 8010"

  web:
    image: node:22-alpine
    container_name: lexaudit-web
    profiles: ["full"]
    working_dir: /app/apps/web
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010
      LEXAUDIT_WEB_ONLY: "1"
    depends_on:
      - api
    command: >
      sh -c "npm install -g pnpm@10 && pnpm install && pnpm build && pnpm start"

volumes:
  lexaudit_pgdata:
  lexaudit_neo4j_data:
