name: CI Qualitäts- & Zitations-Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv installieren
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Python-Abhängigkeiten synchronisieren
        run: uv sync
      - name: Ruff Lint prüfen
        run: uv run ruff check .
      - name: Mypy Typecheck prüfen
        run: uv run mypy packages apps
      - name: Unit- & Integrationstests ausführen
        run: uv run pytest tests/unit
      - name: Eval-Suite mit hartem Citation-Gate ausführen
        run: uv run pytest tests/eval --strict-citations

  web-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Frontend-Abhängigkeiten installieren
        run: pnpm --dir apps/web install
      - name: Lint, Tests & Production-Build
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web test
          pnpm --dir apps/web build
